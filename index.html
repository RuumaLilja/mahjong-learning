<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14524a" />
    <script>
      try {
        if (JSON.parse(localStorage.getItem('mahjong-learning:v1') || 'null')?.settings?.theme === 'black') {
          document.documentElement.dataset.theme = 'black';
          document.querySelector('meta[name="theme-color"]').content = '#20272c';
        }
      } catch { /* Use the default theme when storage is unavailable. */ }
    </script>
    <link rel="icon" type="image/png" href="/favicon-ml.png" />
    <title>麻雀を学ぶ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
